<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="mobile-web-app-capable" content="yes"><title>Chronos</title><style>:root{--ink:#1c2430;--paper:#f3eee4;--card:#fffdf8;--line:#e3dac8;--good:#2b6b4e;--stop:#8b3b34}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.4 system-ui,sans-serif}main{max-width:720px;margin:0 auto;padding:20px 16px 80px}h1{font-size:32px;margin:4px 0}button{font:700 17px system-ui;border-radius:14px;min-height:52px;border:0} .big{width:100%;margin:0 0 10px;color:#fff;background:var(--ink)} .good{background:var(--good)} .stop{background:var(--stop)} .ghost{background:#fff;color:var(--ink);border:1px solid var(--line)} input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:17px system-ui;margin:0 0 8px} .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px} .row{display:flex;gap:8px;align-items:center} .hours{flex:1;text-align:center;font-size:26px;font-weight:800} .muted{color:#6d6458;font-size:15px}</style></head><body><main id="app"></main><script>
const KEY='chronos.cards', PEOPLE='chronos.people', app=document.getElementById('app');
let who='', screen='home', cardId=null, day=0, picked='', role='Employee';
const reasons=['Scheduled off','Took the day off','Half day','Medical appointment','Sick','Held over','Called in','Coverage','Other'];
function load(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function people(){return load(PEOPLE,[])}
function me(){return people().find(p=>p.name.toLowerCase()===who.toLowerCase())||null}
function has(p,r){return !!(p&&p.roles.indexOf(r)!==-1)}
function isAdmin(){return has(me(),'administrator')}
function isGod(){return !!(me()&&me().god)}
function can(x){const p=me(); if(!p||p.active===false) return false; if(isAdmin()) return true; if(x==='employee') return has(p,'employee')||has(p,'supervisor')||has(p,'manager'); if(x==='supervisor') return has(p,'supervisor')||has(p,'manager'); if(x==='manager') return has(p,'manager'); return false}
function el(t,txt,cls){const n=document.createElement(t); if(txt!=null) n.textContent=txt; if(cls) n.className=cls; return n}
function button(txt,cls,fn){const n=el('button',txt,cls); n.type='button'; n.onclick=fn; return n}
function cards(){return load(KEY,[])}
function current(){return cards().find(c=>c.id===cardId)||null}
function update(fn){const all=cards(); const i=all.findIndex(c=>c.id===cardId); if(i<0) return; fn(all[i]); save(KEY,all); render()}
function friday(){const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+((5-d.getDay()+7)%7)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function week(end){const e=new Date(end+'T12:00:00'); return Array.from({length:7},(_,i)=>{const d=new Date(e); d.setDate(e.getDate()-4+i); return {label:d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}), scheduled:480, worked:480, reason:'', note:''}})}
function fmt(m){m=Math.max(0,Math.round(m/15)*15); const h=Math.floor(m/60), r=m%60; return (h?h+' hour'+(h>1?'s':''):'')+(r?(h?' ':'')+r+' min':'')||'0 min'}
function ot(d){return Math.max(0,d.worked-d.scheduled)}
function reg(d){return Math.min(d.worked,d.scheduled)}
function ready(d){return d.worked===d.scheduled||d.reason}
function boss(name){const p=people().find(x=>x.name.toLowerCase()===name.toLowerCase()); if(p&&p.reportsTo) return p.reportsTo; const s=people().filter(x=>has(x,'supervisor')&&x.name!==name); return s.length===1?s[0].name:''}
function render(){app.innerHTML=''; app.appendChild(el('h1','Chronos')); if(!who) return signIn(); if(screen==='admin') return admin(); if(screen==='list') return list(); if(screen==='edit') return edit(); if(screen==='review') return review(); home()}
function signIn(){app.appendChild(el('p','Employee ID and the password you created.','muted')); if(!people().some(p=>has(p,'administrator'))){const name=document.createElement('input'); name.placeholder='Administrator name'; const id=document.createElement('input'); id.placeholder='Administrator employee ID'; const pw=document.createElement('input'); pw.placeholder='Create a password'; pw.type='password'; app.appendChild(name); app.appendChild(id); app.appendChild(pw); app.appendChild(button('Save administrator','big good',()=>{if(!name.value.trim()||!id.value.trim()||!pw.value) return alert('Name, employee ID, and password are required.'); save(PEOPLE,[{name:name.value.trim(), employeeId:id.value.trim(), password:pw.value, roles:['administrator'], active:true, god:true, reportsTo:''}]); who=name.value.trim(); render()})); return} [['administrator','Administrator'],['employee','Employee'],['supervisor','Supervisor'],['manager','Timekeeper']].forEach(([v,l])=>app.appendChild(button(l+' sign in','big',()=>gate(v,l)))); app.appendChild(button('I forgot my password','big ghost',forgot))}
function gate(need,label){const box=el('section','','card'); const id=document.createElement('input'); id.placeholder=label+' employee ID'; const pw=document.createElement('input'); pw.placeholder='Password'; pw.type='password'; box.appendChild(id); box.appendChild(pw); box.appendChild(button('Enter','big good',()=>{const p=people().find(x=>x.employeeId===id.value.trim()&&x.active!==false&&has(x,need)); if(!p) return alert('That employee ID is not assigned to this role.'); if(!p.password){if(!pw.value) return alert('Create your password.'); const all=people(); all.find(x=>x.employeeId===p.employeeId).password=pw.value; save(PEOPLE,all)} else if(p.password!==pw.value) return alert('Password does not match.'); who=p.name; screen='home'; render()})); app.appendChild(box)}
function forgot(){const box=el('section','','card'); const id=document.createElement('input'); id.placeholder='Your employee ID'; const pw=document.createElement('input'); pw.placeholder='New password'; pw.type='password'; box.appendChild(el('p','Any role can reset their own password.','muted')); box.appendChild(id); box.appendChild(pw); box.appendChild(button('Save new password','big good',()=>{const all=people(); const p=all.find(x=>x.employeeId===id.value.trim()); if(!p) return alert('That employee ID is not assigned.'); if(!pw.value) return alert('Create the new password.'); p.password=pw.value; save(PEOPLE,all); alert('Password saved.'); render()})); app.appendChild(box)}
function home(){app.appendChild(el('p','Signed in as '+who+(isAdmin()?(isGod()?', primary administrator.':', administrator.'):'.'))); if(isAdmin()) app.appendChild(button('Assign role','big good',()=>{screen='admin'; render()})); if(can('employee')) app.appendChild(button('My time card','big',()=>{role='Employee'; screen='list'; render()})); const all=cards(); if(can('supervisor')) app.appendChild(button('Supervisor queue — '+all.filter(c=>c.status==='with-supervisor'&&c.sentTo===who&&c.employee!==who).length+' waiting','big',()=>{role='Supervisor'; screen='list'; render()})); if(can('manager')) app.appendChild(button('Timekeeper queue — '+all.filter(c=>c.status==='hours-approved'&&c.sentTo===who&&c.employee!==who).length+' waiting','big',()=>{role='Timekeeper'; screen='list'; render()})); if(can('manager')||isAdmin()) app.appendChild(button('Payroll queue — '+all.filter(c=>c.status==='pay-submitted').length+' waiting','big',()=>{role='Payroll'; screen='list'; render()})); app.appendChild(button('Change my password','big ghost',()=>{const next=prompt('New password'); if(!next) return; const all=people(); const p=all.find(x=>x.name===who); if(p){p.password=next; save(PEOPLE,all); alert('Password saved.')}})); app.appendChild(button('Sign out','big ghost',()=>{who=''; render()}))}
function admin(){if(!isAdmin()) return home(); app.appendChild(el('p',people().filter(p=>has(p,'administrator')&&p.active!==false).length+' of 3 administrators.','muted')); people().forEach(p=>app.appendChild(button(p.name+' · ID '+p.employeeId+' — '+(p.roles.map(r=>r==='manager'?'timekeeper':r).join(', ')||'no role'), picked===p.employeeId?'big good':'big',()=>{picked=p.employeeId; render()}))); const selected=people().find(p=>p.employeeId===picked); if(selected&&selected.god&&!isGod()){const box=el('section','','card'); box.appendChild(el('h2',selected.name+' · primary administrator')); box.appendChild(el('p','You cannot change this account.','muted')); app.appendChild(box)} else if(selected){const box=el('section','','card'); box.appendChild(el('h2',selected.name)); [['employee','Employee'],['supervisor','Supervisor'],['manager','Timekeeper']].forEach(([v,l])=>box.appendChild(button(l+(has(selected,v)?' — on':' — off'), has(selected,v)?'big good':'big ghost',()=>{const all=people(); const f=all.find(x=>x.employeeId===selected.employeeId); f.roles=has(f,v)?f.roles.filter(r=>r!==v):f.roles.concat(v); save(PEOPLE,all); alert('Role saved.'); render()}))); const sel=document.createElement('select'); sel.appendChild(new Option('Reports to no supervisor','')); people().filter(p=>has(p,'supervisor')).forEach(p=>sel.appendChild(new Option('Reports to '+p.name,p.name))); sel.value=selected.reportsTo||''; sel.onchange=()=>{const all=people(); all.find(x=>x.employeeId===selected.employeeId).reportsTo=sel.value; save(PEOPLE,all); render()}; box.appendChild(sel); const nid=document.createElement('input'); nid.placeholder='New employee ID'; box.appendChild(nid); box.appendChild(button('Change employee ID','big',()=>{if(!nid.value.trim()) return alert('Enter the new employee ID.'); const all=people(); if(all.some(x=>x.employeeId===nid.value.trim())) return alert('That employee ID is already assigned.'); all.find(x=>x.employeeId===selected.employeeId).employeeId=nid.value.trim(); picked=nid.value.trim(); save(PEOPLE,all); render()})); app.appendChild(box)} const name=document.createElement('input'); name.placeholder='New name'; const id=document.createElement('input'); id.placeholder='Employee ID'; app.appendChild(name); app.appendChild(id); app.appendChild(button('Add name','big',()=>{if(!name.value.trim()||!id.value.trim()) return alert('Name and employee ID are required.'); const all=people(); all.push({name:name.value.trim(), employeeId:id.value.trim(), password:'', roles:[], reportsTo:'', active:true}); save(PEOPLE,all); picked=id.value.trim(); render()})); const an=document.createElement('input'); an.placeholder='New administrator name'; const ai=document.createElement('input'); ai.placeholder='New administrator employee ID'; app.appendChild(an); app.appendChild(ai); app.appendChild(button('Add administrator','big good',()=>{if(people().filter(p=>has(p,'administrator')&&p.active!==false).length>=3) return alert('There are already 3 administrators.'); if(!an.value.trim()||!ai.value.trim()) return alert('Name and employee ID are required.'); if(people().some(p=>p.employeeId===ai.value.trim())) return alert('That employee ID is already assigned.'); const all=people(); all.push({name:an.value.trim(), employeeId:ai.value.trim(), password:'', roles:['administrator'], reportsTo:'', active:true, god:false}); save(PEOPLE,all); alert('Administrator added. They create their password at sign-in.'); render()})); app.appendChild(button('Back','big ghost',()=>{screen='home'; render()}))}
function list(){const all=cards().filter(c=>{if(role==='Employee') return c.employee===who; if(role==='Supervisor') return c.status==='with-supervisor'&&c.sentTo===who&&c.employee!==who; if(role==='Timekeeper') return c.status==='hours-approved'&&c.sentTo===who&&c.employee!==who; return c.status==='pay-submitted'||c.status==='payroll-accepted'||c.status==='paid'}); if(role==='Employee') app.appendChild(button('Start this week','big good',()=>{const c={id:String(Date.now()), employee:who, weekEnding:friday(), days:week(friday()), status:'draft'}; const all=cards(); all.unshift(c); save(KEY,all); cardId=c.id; day=0; screen='edit'; render()})); if(!all.length) app.appendChild(el('p','Nothing in this workspace.','muted')); all.forEach(c=>{const box=el('section','','card'); box.appendChild(el('h2',c.employee)); box.appendChild(el('p','Week ending '+c.weekEnding+(c.sentTo?' · sent to '+c.sentTo:''),'muted')); box.appendChild(button('Open','big',()=>{cardId=c.id; screen=role==='Employee'&&(c.status==='draft'||c.status==='denied')?'edit':'review'; render()})); app.appendChild(box)}); app.appendChild(button('Back','big ghost',()=>{screen='home'; render()}))}
function edit(){const c=current(); if(!c||c.employee!==who) return list(); const d=c.days[day]; const days=el('div',''); c.days.forEach((item,i)=>days.appendChild(button(item.label.split(',')[0], i===day?'big good':'big ghost',()=>{day=i; render()}))); app.appendChild(days); const box=el('section','','card'); box.appendChild(el('h2',d.label)); box.appendChild(el('div','Scheduled','muted')); box.appendChild(step('scheduled')); box.appendChild(el('div','Worked','muted')); box.appendChild(step('worked')); box.appendChild(el('p',ot(d)?'Overtime: '+fmt(ot(d)):'No overtime.')); if(d.worked!==d.scheduled){reasons.forEach(r=>box.appendChild(button(r, d.reason===r?'big good':'big ghost',()=>update(item=>{item.days[day].reason=r})))); const note=document.createElement('textarea'); note.placeholder='Reason'; note.value=d.note; note.oninput=()=>{const all=cards(); all.find(x=>x.id===cardId).days[day].note=note.value; save(KEY,all)}; box.appendChild(note)} app.appendChild(box); app.appendChild(button('Submit to supervisor','big good',()=>{if(c.days.some(item=>!ready(item))) return alert('A day that does not match the schedule needs a reason.'); const sent=boss(who); if(!sent) return alert('The administrator has not assigned your supervisor.'); update(item=>{item.status='with-supervisor'; item.sentTo=sent}); alert('Sent to '+sent+'.') ; screen='list'; role='Employee'})); app.appendChild(button('Back','big ghost',()=>{screen='list'; render()}))}
function step(key){const row=el('div','','row'); row.appendChild(button('-15','ghost',()=>update(item=>{item.days[day][key]=Math.max(0,item.days[day][key]-15)}))); row.appendChild(el('div',fmt(current().days[day][key]),'hours')); row.appendChild(button('+15','ghost',()=>update(item=>{item.days[day][key]+=15}))); return row}
function review(){const c=current(); if(!c) return list(); app.appendChild(el('h2',c.employee+' · '+c.status)); c.days.forEach(d=>{const box=el('section','','card'); box.appendChild(el('h2',d.label)); box.appendChild(el('p','Regular '+fmt(reg(d))+' · overtime '+fmt(ot(d)))); if(d.reason) box.appendChild(el('p',[d.reason,d.note].filter(Boolean).join(' — '),'muted')); app.appendChild(box)}); const note=document.createElement('textarea'); note.placeholder='Reason if you return this card'; if(role==='Supervisor'&&c.status==='with-supervisor'&&c.sentTo===who&&c.employee!==who){app.appendChild(note); app.appendChild(button('Approve hours','big good',()=>{const next=boss(who)|| (people().find(p=>has(p,'manager'))||{}).name || c.sentTo; update(item=>{item.status='hours-approved'; item.sentTo=next}); screen='list'})); app.appendChild(button('Return for correction','big stop',()=>{if(!note.value.trim()) return alert('Say why it was returned.'); update(item=>{item.status='denied'}); screen='list'}))}
if(role==='Timekeeper'&&c.status==='hours-approved'&&c.sentTo===who&&c.employee!==who){app.appendChild(button('Approve for payroll','big good',()=>{update(item=>{item.status='pay-submitted'}); excel(current()); screen='list'})); app.appendChild(button('Return for correction','big stop',()=>update(item=>{item.status='denied'})))}
if((role==='Payroll'||isAdmin())&&c.status==='pay-submitted') app.appendChild(button('Payroll accept','big good',()=>update(item=>{item.status='payroll-accepted'}))); if((role==='Payroll'||isAdmin())&&c.status==='payroll-accepted') app.appendChild(button('Mark completed','big good',()=>update(item=>{item.status='paid'}))); app.appendChild(button('Back','big ghost',()=>{screen='list'; render()}))}
function excel(c){const headers=['Employee','Week ending','Day','Scheduled hours','Worked hours','Regular hours','Overtime hours','Reason','Status']; const rows=c.days.map(d=>[c.employee,c.weekEnding,d.label,d.scheduled/60,d.worked/60,reg(d)/60,ot(d)/60,d.reason||'',c.status]); const cell=(v,t)=>'<Cell><Data ss:Type="'+t+'">'+String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</Data></Cell>'; const body=['<Row>'+headers.map(h=>cell(h,'String')).join('')+'</Row>'].concat(rows.map(r=>'<Row>'+r.map((v,i)=>cell(v,i>=3&&i<=6?'Number':'String')).join('')+'</Row>')).join(''); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Time card"><Table>'+body+'</Table></Worksheet></Workbook>'],{type:'application/vnd.ms-excel'})); a.download='Chronos-'+c.employee.replace(/[^a-z0-9]+/gi,'-')+'-'+c.weekEnding+'.xls'; a.click()}
render();
</script></body></html>
